openapi: 3.2.1
info:
  title: CueX Gateway HTTP API
  version: 2026-11
  description: |
    Stage C Synced Contract Spec matching `apps/server/src/gateway/GatewayServer.ts` and `@cuex/protocol` (`API_VERSION = '2026-11'`, v2.1.0 Colab GPU ASR & CPA telemetry extensions).
    Monetary fields use integer minor units (`amountFen`, CNY Fen). Timestamps use UTC ISO-8601 (`UtcIso8601`).
    Unified `PlanCatalog` pricing and quotas (`Free ¥0 / 2 sessions / 20m cloud ASR`, `Event ¥29 / 14d / 120m`, `Pro ¥59/mo · ¥499/yr / 240m`, `Team ¥199/seat/mo planned`, all marked `isCommercialHypothesis: true`) align with `docs/business/PRICING_AND_PACKAGING.md` and `ppt/scripts/cuex-final-metrics.json`.
servers:
  - url: http://127.0.0.1:8765
    description: Local development gateway (`HOST=127.0.0.1`, `PORT=8765`)
  - url: https://api.cuex.example.com
    description: Staging / Production TLS reverse-proxy gateway

security:
  - BearerAuth: []

tags:
  - name: System
  - name: Auth
  - name: Scenarios
  - name: Presentation
  - name: Memory
  - name: Sessions
  - name: Billing & Usage
  - name: Privacy
  - name: Observability

paths:
  /health:
    get:
      tags: [System]
      summary: Server, SQLite, ASR, System 1 & System 2 readiness health probe
      security: []
      responses:
        '200':
          description: Service healthy (returns 503 if SQLite ping fails)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'
        '503':
          description: 'Database unavailable (`ok: false`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'

  /api/scenarios:
    get:
      tags: [Scenarios]
      summary: List scenario capability descriptors (`presentation=implemented`; others=`roadmap`)
      security: []
      responses:
        '200':
          description: Scenario capability registry
          content:
            application/json:
              schema:
                type: object
                required: [scenarios]
                properties:
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioCapabilityDescriptor'

  /api/plans:
    get:
      tags: [Billing & Usage]
      summary: List commercial pricing plans and quotas from PlanCatalog (`isCommercialHypothesis=true`)
      security: []
      responses:
        '200':
          description: Plan catalog definitions
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanDefinition'

  /api/auth/session:
    post:
      tags: [Auth]
      summary: Issue a tenant-scoped bearer session token (`auth_tokens` SQLite table, SHA-256 hashed)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionCreateInput'
      responses:
        '200':
          description: Authenticated session, user record, active entitlements & usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current bearer session token if provided
      security: []
      responses:
        '200':
          description: Logout acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [loggedOut]
                properties:
                  loggedOut:
                    type: boolean
                    example: true

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Retrieve authenticated user identity, active entitlements & current billing-window usage summary
      responses:
        '200':
          description: Authenticated account context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /api/account/entitlements:
    get:
      tags: [Billing & Usage]
      summary: Query user entitlements and current UTC billing window usage summary
      responses:
        '200':
          description: User entitlements & usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/account/usage:
    get:
      tags: [Billing & Usage]
      summary: Query recent UsageRecords for the current period alongside summary and entitlements
      responses:
        '200':
          description: Account usage ledger & summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUsageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/account/export:
    get:
      tags: [Privacy]
      summary: Export all owned packs, reflections, opt-in memories, entitlements, usage records & billing audits
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [json, markdown]
            default: json
      responses:
        '200':
          description: Machine-readable JSON export bundle (`UserDataExportBundle`) or Markdown report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataExportBundle'
            text/markdown:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/account/data:
    delete:
      tags: [Privacy]
      summary: Permanently erase user packs, sessions, reflections, memories, telemetry, usage records & auth tokens (preserving statutory billing audits)
      responses:
        '200':
          description: Data erasure receipt with deleted counts, preserved billing audits & third-party caveats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletionReceipt'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/billing/checkout-preview:
    post:
      tags: [Billing & Usage]
      summary: Preview checkout pricing & Fen breakdown (sandbox only; records `checkout_preview` audit row)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCheckoutPreviewRequest'
      responses:
        '200':
          description: Sandbox checkout preview breakdown in CNY Fen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckoutPreviewResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/billing/webhook:
    post:
      tags: [Billing & Usage]
      summary: Receive HMAC-SHA256 signed PaymentWebhookEvent (`x-cuex-signature` or `x-webhook-signature`)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '200':
          description: 'Webhook verified and processed idempotently (`{ received: true, deduplicated, entitlement?, audit }`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookProcessedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '501':
          $ref: '#/components/responses/PaymentNotConfiguredError'

  /api/billing/webhooks/{provider}:
    parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [sandbox, wechat_pay, alipay]
    post:
      tags: [Billing & Usage]
      summary: Provider-scoped HMAC-SHA256 webhook endpoint (path provider must match payload `provider`)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '200':
          description: Webhook verified and processed idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookProcessedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/PaymentNotConfiguredError'

  /api/presentation/extract:
    post:
      tags: [Presentation]
      summary: Safely extract structured text & sections from `.pptx`, `.pdf`, `.md`, or `.txt`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationExtractInput'
      responses:
        '200':
          description: Extraction result (honestly flags unreadable scanned/encrypted PDFs and rejects unsafe archive entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationExtractResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /api/presentation/compile:
    post:
      tags: [Presentation]
      summary: Compile extracted materials into a schema v2 PresentationContextPack (returns HTTP 201)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationCompileInput'
      responses:
        '201':
          description: Compiled ContextPack persisted to `presentation_packs`
          content:
            application/json:
              schema:
                type: object
                required: [pack]
                properties:
                  pack:
                    $ref: '#/components/schemas/PresentationContextPack'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /api/presentation/packs:
    get:
      tags: [Presentation]
      summary: List PresentationContextPack summaries accessible to the authenticated user (owned + built-in sample)
      responses:
        '200':
          description: Pack summaries list
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs:
                    type: array
                    items:
                      $ref: '#/components/schemas/PresentationPackSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/presentation/packs/{packId}:
    parameters:
      - in: path
        name: packId
        required: true
        schema:
          type: string
    get:
      tags: [Presentation]
      summary: Retrieve an owned or built-in sample PresentationContextPack
      responses:
        '200':
          description: Full pack payload
          content:
            application/json:
              schema:
                type: object
                required: [pack]
                properties:
                  pack:
                    $ref: '#/components/schemas/PresentationContextPack'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Presentation]
      summary: Update goal, facts, Q&A cards, cueSheet, or forbiddenClaims on an owned pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationPackPatchInput'
      responses:
        '200':
          description: Updated pack payload
          content:
            application/json:
              schema:
                type: object
                required: [pack]
                properties:
                  pack:
                    $ref: '#/components/schemas/PresentationContextPack'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/memory:
    get:
      tags: [Memory]
      summary: List user-confirmed MemoryItems owned by the authenticated user
      parameters:
        - in: query
          name: scenarioId
          schema:
            type: string
        - in: query
          name: sessionId
          schema:
            type: string
      responses:
        '200':
          description: Confirmed memory items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemoryItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Memory]
      summary: Persist a new MemoryItem (strictly requires `userConfirmed === true`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreateInput'
      responses:
        '201':
          description: Created MemoryItem
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/MemoryItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/memory/{memoryId}:
    parameters:
      - in: path
        name: memoryId
        required: true
        schema:
          type: string
    patch:
      tags: [Memory]
      summary: Update or revoke an owned MemoryItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryPatchInput'
      responses:
        '200':
          description: 'Updated memory item (`{ item }`) or deleted status (`{ deleted: true }`)'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Memory]
      summary: Permanently delete an owned MemoryItem
      responses:
        '200':
          description: 'Deletion confirmed (`{ deleted: boolean }`)'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/sessions:
    get:
      tags: [Sessions]
      summary: List stored presentation sessions owned by the authenticated user
      responses:
        '200':
          description: Session summary list (`SessionSummaryItem[]`)
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummaryItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/sessions/{sessionId}:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
    get:
      tags: [Sessions]
      summary: Retrieve an owned session record and optional reflection
      responses:
        '200':
          description: Session record and reflection if generated
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  reflection:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Privacy, Sessions]
      summary: Delete & wipe session data, events, reflection, telemetry & session-linked memories
      responses:
        '200':
          description: Wipe completed with DataDeletionReceipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletionReceipt'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/sessions/{sessionId}/reflection:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
      - in: query
        name: lambda
        schema:
          type: number
          default: 2
    get:
      tags: [Sessions]
      summary: Retrieve durable PresentationReflection (`V = H - λI`, timeline, weakSegments) for an owned session
      responses:
        '200':
          description: Stored or computed reflection payload
          content:
            application/json:
              schema:
                type: object
                required: [reflection]
                properties:
                  reflection:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/sessions/{sessionId}/wipe:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
    post:
      tags: [Privacy, Sessions]
      summary: Immediately erase session runtime data, events, reflection, telemetry & session-linked memories; returns DataDeletionReceipt
      responses:
        '200':
          description: Wipe completed with explicit receipt and statutory retention disclosures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletionReceipt'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/observability/summary:
    get:
      tags: [Observability]
      summary: Retrieve runtime operational metrics snapshot & pipeline stage counters
      responses:
        '200':
          description: Metrics & EventPipeline summary
          content:
            application/json:
              schema:
                type: object
                required: [metrics, pipeline]
                properties:
                  metrics:
                    type: object
                    additionalProperties: true
                  pipeline:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: CueXSessionToken

  responses:
    ValidationError:
      description: Input failed runtime schema or security validation (`400`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UnauthorizedError:
      description: Missing, expired, or invalid bearer token or webhook HMAC signature (`401`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ForbiddenError:
      description: Authenticated user does not own target resource or CORS origin rejected (`403`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFoundError:
      description: Requested resource not found (`404`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    RateLimitedError:
      description: Sliding-window rate limit exceeded (`429`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    QuotaExceededError:
      description: Plan entitlement sessions or live minutes quota exhausted (`402`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    PaymentNotConfiguredError:
      description: Payment webhook secret (`CUEX_WEBHOOK_SECRET`) not configured (`501`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    UtcIso8601:
      type: string
      format: date-time
      example: '2026-11-16T04:00:00.000Z'

    MoneyAmount:
      type: object
      required: [amountFen, currency]
      properties:
        amountFen:
          type: integer
          minimum: 0
          example: 5900
        currency:
          type: string
          enum: [CNY]

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - PROVIDER_TIMEOUT
        - PROVIDER_UNAVAILABLE
        - QUOTA_EXCEEDED
        - SCHEMA_VERSION_UNSUPPORTED
        - SESSION_EXPIRED
        - ASR_UNAVAILABLE
        - INSUFFICIENT_EVIDENCE
        - PAYMENT_NOT_CONFIGURED
        - INTERNAL_ERROR

    ApiErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message, httpStatus, retryable, timestamp]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            httpStatus:
              type: integer
            retryable:
              type: boolean
            correlationId:
              type: string
            requestId:
              type: string
            timestamp:
              $ref: '#/components/schemas/UtcIso8601'
            details:
              type: array
              items:
                type: object
                additionalProperties: true

    ColabAsrLifecycleState:
      type: string
      enum:
        - not_configured
        - starting
        - ready
        - degraded
        - disconnected
        - restarting
        - unavailable

    AsrBackendMode:
      type: string
      enum: [colab_gpu, local_sherpa, remote_sherpa, browser_webspeech, text_simulation]

    AsrCapabilityStatus:
      type: object
      required: [backend, mode, available, streaming, detail]
      properties:
        backend:
          type: string
        mode:
          $ref: '#/components/schemas/AsrBackendMode'
        available:
          type: boolean
        streaming:
          type: boolean
        detail:
          type: string
        lifecycleState:
          $ref: '#/components/schemas/ColabAsrLifecycleState'
        gpuName:
          type: string
        modelId:
          type: string
        rtf:
          type: number
          minimum: 0
        lastHealthCheckAt:
          $ref: '#/components/schemas/UtcIso8601'
        fallbackActive:
          type: boolean
        fallbackReason:
          type: string

    LlmSubsystemHealthStatus:
      type: object
      required: [backend, mode, healthy]
      properties:
        backend:
          type: string
        mode:
          type: string
          enum: [real, local_fallback]
        healthy:
          type: boolean
        detail:
          type: string
        provider:
          type: string
        model:
          type: string
        degraded:
          type: boolean
        lastHealthCheckAt:
          $ref: '#/components/schemas/UtcIso8601'

    TelemetryUsageSource:
      type: string
      enum: [provider_reported, provider_unreported, local_rule_zero, estimated]

    ProviderUsageRecord:
      type: object
      required: [inputTokens, outputTokens, cachedInputTokens, modelCalls, usageSource]
      properties:
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        cachedInputTokens:
          type: integer
          minimum: 0
        reasoningTokens:
          type: integer
          minimum: 0
        modelCalls:
          type: integer
          minimum: 0
        retries:
          type: integer
          minimum: 0
        usageSource:
          $ref: '#/components/schemas/TelemetryUsageSource'
        degraded:
          type: boolean
        costFen:
          type: integer
          minimum: 0
        provider:
          type: string
        model:
          type: string
        correlationId:
          type: string

    HealthStatusResponse:
      type: object
      required: [ok, service, version, apiVersion, wsProtocolVersion, timestamp, asr, system1, system2]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: cuex-server
        version:
          type: string
          example: 2.1.0
        apiVersion:
          type: string
          example: '2026-11'
        wsProtocolVersion:
          type: string
          example: '2.0'
        timestamp:
          $ref: '#/components/schemas/UtcIso8601'
        asr:
          $ref: '#/components/schemas/AsrCapabilityStatus'
        system1:
          $ref: '#/components/schemas/LlmSubsystemHealthStatus'
        system2:
          $ref: '#/components/schemas/LlmSubsystemHealthStatus'

    AuthSessionCreateInput:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        tenantId:
          type: string
        inviteCode:
          type: string

    UserAccount:
      type: object
      required: [userId, tenantId, displayName, role, authMode, createdAt, updatedAt]
      properties:
        userId:
          type: string
        tenantId:
          type: string
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, member, admin]
        authMode:
          type: string
          enum: [local_demo, session_token, invite_code]
        createdAt:
          $ref: '#/components/schemas/UtcIso8601'
        updatedAt:
          $ref: '#/components/schemas/UtcIso8601'

    AuthSessionResponse:
      type: object
      required: [authenticated, token, user, sessionTokenExpiresAt, entitlements, usageSummary]
      properties:
        authenticated:
          type: boolean
        token:
